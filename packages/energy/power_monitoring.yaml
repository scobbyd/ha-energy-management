# Energy Package - Power Monitoring
# Manages energy consumption, production, and net usage calculations

template:
  # Determine net energy usage of house, minus PV production
  - sensor:
      - name: "nett energy use house"
        unique_id: nett_energy_use_house
        unit_of_measurement: "kW"
        state: >
          {% set consumption = states('sensor.power_consumed') | float(0) %}
          {% set production = states('sensor.power_produced') | float(0) %}
          {{ (consumption - production) | round(3) }}
        availability: >
          {{ states('sensor.power_consumed') not in ['unavailable', 'unknown'] and
             states('sensor.power_produced') not in ['unavailable', 'unknown'] }}

      # Total PV energy produced today: MPPT + AC-coupled microinverter.
      # The microinverter sensors are optional — remove this sensor if you
      # only have MPPT-coupled PV (see CUSTOMIZE.md).
      - name: "total pv energy today"
        unique_id: total_pv_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant-outline
        state: >
          {% set mppt = states('sensor.inverter_today_production') | float(0) %}
          {% set micro = states('sensor.inverter_microinverter_energy_today') | float(0) %}
          {{ (mppt + micro) | round(1) }}
        availability: >
          {{ states('sensor.inverter_today_production') not in ['unavailable', 'unknown'] }}

  # Total PV production: MPPT (DC-coupled) + AC-coupled microinverter.
  # Trigger-based: updates every 30 seconds instead of on every source change
  - trigger:
      - platform: time_pattern
        seconds: "/30"
    sensor:
      - name: "total pv power"
        unique_id: total_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {% set mppt = states('sensor.inverter_pv_power') | int(0) %}
          {% set micro = states('sensor.inverter_microinverter_power') | int(0) %}
          {{ mppt + micro }}
        availability: >
          {{ states('sensor.inverter_pv_power') not in ['unavailable', 'unknown'] }}
