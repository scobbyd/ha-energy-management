# =============================================================================
# EXPERIMENTAL — Morning Export Priority (MEP) / Solcast PV-charge-block
# -----------------------------------------------------------------------------
# THIS FEATURE IS NOT PRODUCTION-VALIDATED. It ships with its master switch
# (input_boolean.mep_enabled) OFF by default and should stay OFF until you have
# dry-run and verified it on your own system.
#
# Why experimental:
#   - It deliberately lowers battery CHARGE current toward a soft floor, which
#     is the same class of lever that caused a 0 A charge-stranding bug; the
#     soft floor mitigates this but the interaction has not been long-run tested.
#   - It depends on a heavy extra entity surface that is NOT part of the core
#     EMS and is NOT in the default CUSTOMIZE map (see the EXPERIMENTAL section
#     of CUSTOMIZE.md):
#       * sensor.solcast_pv_forecast_forecast_today  (P10/P50/P90 detailedForecast)
#       * sensor.average_electricity_price           (prices_today attribute)
#       * sensor.daily_energy_usage_house            (a utility_meter, Wh, daily reset)
#       * sensor.inverter_battery_capacity           (pack capacity in kWh)
#   - It is tied to an imbalance-settlement economic model; the payoff only
#     exists if your supplier pays positive export prices in the morning window.
#
# Leave this file out entirely if you do not have the dependencies above.
# =============================================================================
#
# Energy Package - Morning Export Priority (MEP)
# ----------------------------------------------------------------------------
# While the EMS state machine is in NORMAL during the morning window, soft-floor
# the battery charge current so morning PV is exported at positive prices instead
# of charging the pack, but ONLY when the forecast says the midday cheap-hour PV
# surplus will refill the battery (capacity left to fill + a consumption buffer).
#
# This mirrors the aFRR PV-priority prestage layer (see afrr_pv_priority.yaml):
# a current-modulation layer that acts only in selected EMS states and keeps its
# hands off the lever in every other state. aFRR owns DISCHARGE current; MEP owns
# CHARGE current, and only while in NORMAL.
#
# Soft floor (not 0 A) on purpose: a true 0 A reintroduces the SELL->NORMAL
# charge-stranding bug and the BMS OVP-imbalance behaviour at near-zero current.
# ~20 A (~1 kW) exports the bulk of morning PV, keeps the pack trickling and the
# BMS balancing, and still lets a cheap-price grid-charge through.
#
# Decision threshold y reuses input_number.provider_fee (the SELF_CONSUME
# boundary). See the spec for the deliberate "decouple y later" escape hatch.
#
# NOTE: per energy_helpers.yaml convention, helpers carry NO `initial:` (it would
# overwrite tuned values on every restart). The ONE exception is
# mep_charge_restore_amps: initial 240 is wanted so the restore value is
# boot-safe and never read from stale storage.

input_boolean:
  mep_enabled:
    name: "MEP Enabled"
    icon: mdi:solar-power-variant-outline

input_number:
  # Soft floor written to the charge register during deferral (default 20 A ~ 1 kW).
  mep_charge_floor_amps:
    name: "MEP Charge Floor"
    icon: mdi:battery-charging-low
    min: 0
    max: 240
    step: 5
    unit_of_measurement: "A"

  # Value restored when not deferring. initial:240 is the deliberate exception to
  # the no-initial-value rule, so the restore is boot-safe.
  mep_charge_restore_amps:
    name: "MEP Charge Restore"
    icon: mdi:battery-charging-100
    initial: 240
    min: 0
    max: 240
    step: 5
    unit_of_measurement: "A"

  # Below this SOC, never defer (charge from morning sun). Default 30 %.
  mep_soc_floor:
    name: "MEP SOC Floor"
    icon: mdi:battery-30
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"

  # Solcast blend weights. Default 50/50 P10/P50; P90 unused.
  mep_pv_weight_p10:
    name: "MEP PV Weight P10"
    icon: mdi:weather-cloudy
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"

  mep_pv_weight_p50:
    name: "MEP PV Weight P50"
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"

  mep_pv_weight_p90:
    name: "MEP PV Weight P90"
    icon: mdi:weather-sunny
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"

  # Minimum |delta amps| before writing the charge register (mirrors aFRR).
  mep_step_deadband:
    name: "MEP Step Deadband"
    icon: mdi:vibrate
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "A"

input_datetime:
  # Morning deferral window. Defaults 06:00 / 12:00 (time-only).
  mep_window_start:
    name: "MEP Window Start"
    has_date: false
    has_time: true

  mep_window_end:
    name: "MEP Window End"
    has_date: false
    has_time: true

template:
  - sensor:
      # Stage 1 of the 14-day consumption baseline. daily_energy_usage_house is a
      # utility_meter (daily reset, in Wh); its last_period attribute holds the
      # previous full day's total. Convert to kWh; value changes once per day at
      # the reset edge, which is exactly one sample per day for the statistics
      # sensor below.
      - name: "MEP Consumption Yesterday"
        unique_id: mep_consumption_yesterday
        icon: mdi:home-lightning-bolt
        unit_of_measurement: "kWh"
        state: >
          {{ state_attr('sensor.daily_energy_usage_house', 'last_period')
             | float(0) / 1000 }}
        availability: >
          {{ state_attr('sensor.daily_energy_usage_house', 'last_period') is not none }}

      # Heavy compute, isolated here so it runs once per dependency change rather
      # than once per attribute. State = forecast PV (kWh) over the remaining
      # cheap-price quarters today; attributes carry the window size. Uses now(),
      # so HA re-renders it about once a minute, shrinking the window as the day
      # advances. Solcast pv_estimate* are kW (verified: sum x 0.5h = daily total),
      # so energy per 15-min price quarter = blended kW x 0.25 h.
      - name: "MEP Forecast PV Cheap"
        unique_id: mep_forecast_pv_cheap
        icon: mdi:solar-power
        unit_of_measurement: "kWh"
        state: >
          {% set y = states('input_number.provider_fee') | float(20) / 1000 %}
          {% set w10 = states('input_number.mep_pv_weight_p10') | float(50) %}
          {% set w50 = states('input_number.mep_pv_weight_p50') | float(50) %}
          {% set w90 = states('input_number.mep_pv_weight_p90') | float(0) %}
          {% set wsum = w10 + w50 + w90 %}
          {% set prices = state_attr('sensor.average_electricity_price', 'prices_today') %}
          {% set solcast = state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') %}
          {% set now_ts = now().timestamp() %}
          {% set ns = namespace(forecast_pv=0.0) %}
          {% if prices is iterable and solcast is iterable and wsum > 0 %}
            {% for p in prices %}
              {% set pts = as_timestamp(p.time) %}
              {% if pts is not none and pts >= now_ts and (p.price | float(999)) < y %}
                {% set kns = namespace(kw=0.0, found=false) %}
                {% for s in solcast %}
                  {% if not kns.found %}
                    {% set sst = as_timestamp(s.period_start) %}
                    {% if sst is not none and sst <= pts and pts < sst + 1800 %}
                      {% set kns.kw = (w10 * (s.pv_estimate10 | float(0))
                                     + w50 * (s.pv_estimate   | float(0))
                                     + w90 * (s.pv_estimate90 | float(0))) / wsum %}
                      {% set kns.found = true %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% set ns.forecast_pv = ns.forecast_pv + kns.kw * 0.25 %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.forecast_pv | round(3) }}
        availability: >
          {{ state_attr('sensor.average_electricity_price', 'prices_today') is iterable
             and state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') is iterable }}
        attributes:
          threshold_y: >
            {{ states('input_number.provider_fee') | float(20) / 1000 }}
          cheap_quarters: >
            {% set y = states('input_number.provider_fee') | float(20) / 1000 %}
            {% set prices = state_attr('sensor.average_electricity_price', 'prices_today') %}
            {% set now_ts = now().timestamp() %}
            {% set ns = namespace(n=0) %}
            {% if prices is iterable %}
              {% for p in prices %}
                {% set pts = as_timestamp(p.time) %}
                {% if pts is not none and pts >= now_ts and (p.price | float(999)) < y %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.n }}
          cheap_hours: >
            {% set y = states('input_number.provider_fee') | float(20) / 1000 %}
            {% set prices = state_attr('sensor.average_electricity_price', 'prices_today') %}
            {% set now_ts = now().timestamp() %}
            {% set ns = namespace(n=0) %}
            {% if prices is iterable %}
              {% for p in prices %}
                {% set pts = as_timestamp(p.time) %}
                {% if pts is not none and pts >= now_ts and (p.price | float(999)) < y %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {# cheap_quarters * 0.25 h per quarter #}
            {{ ns.n * 0.25 }}

      # Margin = forecast cheap-window PV minus (capacity-to-fill + buffer).
      # Standalone numeric sensor (not just an attribute) so the recorder logs it
      # and it can be graphed for tuning: positive = comfortable to defer, negative
      # = at risk of not refilling. binary_sensor.mep_defer_recommended is margin>=0.
      - name: "MEP Margin"
        unique_id: mep_margin
        icon: mdi:scale-balance
        unit_of_measurement: "kWh"
        state: >
          {% set soc = states('sensor.inverter_battery') | float(0) %}
          {% set cap = states('sensor.inverter_battery_capacity') | float(45.4) %}
          {% set fpv = states('sensor.mep_forecast_pv_cheap') | float(0) %}
          {% set cheap_h = state_attr('sensor.mep_forecast_pv_cheap', 'cheap_hours') | float(0) %}
          {% set avg = states('sensor.mep_daily_avg_consumption') | float(10) %}
          {{ (fpv - (cap * (100 - soc) / 100 + 2 * (avg / 24) * cheap_h)) | round(1) }}
        availability: >
          {{ states('sensor.inverter_battery') not in ['unavailable', 'unknown']
             and states('sensor.inverter_battery_capacity') not in ['unavailable', 'unknown']
             and states('sensor.mep_forecast_pv_cheap') not in ['unavailable', 'unknown'] }}

  - binary_sensor:
      # The forecast VERDICT (recommendation), not the live action: true when the
      # forecast cheap-hour PV will refill the pack with margin (margin >= 0). The
      # ACTUAL deferral is visible on number.inverter_battery_max_charging_current
      # (floored while deferring). Sub-terms exposed as attributes.
      - name: "MEP Defer Recommended"
        unique_id: mep_defer_charging
        icon: mdi:transmission-tower-export
        state: >
          {% set soc = states('sensor.inverter_battery') | float(0) %}
          {% set cap = states('sensor.inverter_battery_capacity') | float(45.4) %}
          {% set fpv = states('sensor.mep_forecast_pv_cheap') | float(0) %}
          {% set cheap_h = state_attr('sensor.mep_forecast_pv_cheap', 'cheap_hours') | float(0) %}
          {% set avg = states('sensor.mep_daily_avg_consumption') | float(10) %}
          {% set to_full = cap * (100 - soc) / 100 %}
          {% set buffer = 2 * (avg / 24) * cheap_h %}
          {{ fpv >= to_full + buffer }}
        availability: >
          {{ states('sensor.inverter_battery') not in ['unavailable', 'unknown']
             and states('sensor.inverter_battery_capacity') not in ['unavailable', 'unknown']
             and states('sensor.mep_forecast_pv_cheap') not in ['unavailable', 'unknown'] }}
        attributes:
          to_full: >
            {% set soc = states('sensor.inverter_battery') | float(0) %}
            {% set cap = states('sensor.inverter_battery_capacity') | float(45.4) %}
            {{ (cap * (100 - soc) / 100) | round(1) }}
          forecast_pv: >
            {{ states('sensor.mep_forecast_pv_cheap') | float(0) | round(1) }}
          cheap_hours: >
            {{ state_attr('sensor.mep_forecast_pv_cheap', 'cheap_hours') | float(0) }}
          buffer: >
            {% set cheap_h = state_attr('sensor.mep_forecast_pv_cheap', 'cheap_hours') | float(0) %}
            {% set avg = states('sensor.mep_daily_avg_consumption') | float(10) %}
            {{ (2 * (avg / 24) * cheap_h) | round(1) }}
          margin: >
            {{ states('sensor.mep_margin') | float(0) }}

sensor:
  # Stage 2: mean of the last 14 daily totals. Source updates once/day, so
  # ~14 samples fill the window. sampling_size headroom is 20.
  - platform: statistics
    name: "MEP Daily Avg Consumption"
    unique_id: mep_daily_avg_consumption
    entity_id: sensor.mep_consumption_yesterday
    state_characteristic: mean
    max_age:
      days: 14
    sampling_size: 20

automation:
  # Morning Export Priority charge-current gate.
  # Acts ONLY while ems_state == NORMAL (the condition below). In NORMAL it either
  # soft-floors the charge current (defer: export morning PV) or restores it.
  # Outside NORMAL the condition fails and the automation does nothing, leaving
  # charge current to the state machine / SELL branch. Because the only place MEP
  # ever writes the floor is in NORMAL, "restore only in NORMAL" also covers the
  # master-off case: turning the switch off while in NORMAL restores 240 A; turning
  # it off in any other state needs no action (MEP never wrote there).
  - id: mep_charge_gate
    alias: "Energy - MEP - Charge Current Gate"
    description: >
      While EMS is NORMAL during the morning window, soft-floor battery charge
      current to export morning PV when the decision sensor confirms the midday
      cheap-hour PV surplus will refill the pack. Restores full charge current
      otherwise. Never acts outside NORMAL.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id: binary_sensor.mep_defer_charging
      - platform: state
        entity_id: input_select.ems_state
      - platform: state
        entity_id: input_boolean.mep_enabled
      - platform: homeassistant
        event: start
    condition:
      # The hard gate: only ever touch charge current in NORMAL.
      - condition: state
        entity_id: input_select.ems_state
        state: "NORMAL"
      # Do not act on unavailable inputs (e.g. immediately after restart).
      - condition: template
        value_template: >
          {{ states('sensor.inverter_battery') not in ['unavailable', 'unknown']
             and states('number.inverter_battery_max_charging_current') not in ['unavailable', 'unknown']
             and states('input_datetime.mep_window_start') not in ['unavailable', 'unknown']
             and states('input_datetime.mep_window_end') not in ['unavailable', 'unknown'] }}
    action:
      - variables:
          mep_on: "{{ is_state('input_boolean.mep_enabled', 'on') }}"
          soc: "{{ states('sensor.inverter_battery') | float(0) }}"
          soc_floor: "{{ states('input_number.mep_soc_floor') | float(30) }}"
          defer_dec: "{{ is_state('binary_sensor.mep_defer_charging', 'on') }}"
          floor_a: "{{ states('input_number.mep_charge_floor_amps') | int(20) }}"
          restore_a: "{{ states('input_number.mep_charge_restore_amps') | int(240) }}"
          deadband: "{{ states('input_number.mep_step_deadband') | float(5) }}"
          current_a: "{{ states('number.inverter_battery_max_charging_current') | int(240) }}"
          now_hm: "{{ now().strftime('%H:%M') }}"
          wstart: "{{ states('input_datetime.mep_window_start')[:5] }}"
          wend: "{{ states('input_datetime.mep_window_end')[:5] }}"
          in_window: "{{ wstart <= now_hm < wend }}"
          defer: "{{ mep_on and in_window and soc >= soc_floor and defer_dec }}"
          target_a: "{{ floor_a if defer else restore_a }}"
      - if:
          - condition: template
            value_template: "{{ (target_a - current_a) | abs > deadband }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.inverter_battery_max_charging_current
            data:
              value: "{{ target_a }}"
          - action: system_log.write
            data:
              message: >
                MEP charge gate: {{ 'DEFER' if defer else 'restore' }} ->
                {{ target_a }}A (was {{ current_a }}A) | in_window={{ in_window }}
                soc={{ soc }} dec={{ defer_dec }} mep_on={{ mep_on }}
              level: info
              logger: homeassistant.energy.mep
