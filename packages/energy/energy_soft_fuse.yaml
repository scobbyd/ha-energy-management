# Energy Package - Soft Fuse Controller
# Independent safety layer monitoring P1 per-phase current.
# Runs every 10 seconds regardless of EMS state.
# Adjusts BATTERY DISCHARGE CEILING to keep max phase current near fuse rating.
#
# Battery-first rationale: PV-lift was unreliable (firmware only honors
# number.inverter_pv_power in Zero Export To CT; ignored in Export First),
# weather-dependent, and slow. Battery discharge ceiling is honored in all
# work modes — register write is instant, though BMS physical response can
# take 20-40s at high SOC (battery throttled when near full).
#
# Hardcoded for 25A fuses. To adjust for different fuse ratings, change:
#   - Zone thresholds: 23/26A in the conditions below
#   - Correction target: 25A (fuse_limit) and 24A (SAFE target)
#
# Zones (25A fuse):
#   SAFE     (< 23A)  — 60s sustained → ladder DOWN battery dch toward floor
#   NOMINAL  (23-25A) — dead zone, reset trackers
#   OVERLOAD (>= 26A) — 30s cooldown → step UP battery dch (10A per A overshoot)
#
# Formula: 5 A of battery discharge ceiling per 1 A of phase overshoot.
# Intentionally under-sized per step (~0.4 A of phase relief per step, since
# 5 A × 55 V / 3 phases / 230 V = ~0.4 A) so the soft fuse iterates multiple
# times before reaching target, giving the BMS physical ramp time between steps.
# Halved from original 10 A/A after empirical test showed 10 A/A over-shot
# on a 5 A overshoot (DchA jumped 0→50A when ~25A would have sufficed).
#
# Cooldown: 30s between up-fires. Short enough to converge within 2-3 minutes
# of sustained overload, long enough for BMS to respond between steps.
# State transitions cancel the hold (load profile changed).
#
# Kill fallback: if battery ceiling maxes at 240A and phase still >= 26A,
# dumpload is killed (io_mode → Generator) only in DUMP state.

automation:
  - id: soft_fuse_controller
    alias: "Energy - Soft Fuse - Controller"
    description: "Monitor P1 phase currents every 10s, adjust battery discharge ceiling to protect fuses"
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/10"
    condition:
      # Master EMS gate — soft fuse is part of the EMS stack and stops when it stops
      - condition: state
        entity_id: input_boolean.ems_enabled
        state: "on"
      # P1 must be available
      - condition: template
        value_template: >
          {{ states('sensor.p1reader2_p1_reader_2_current_l1') not in ['unavailable', 'unknown']
             and states('sensor.p1reader2_p1_reader_2_current_l2') not in ['unavailable', 'unknown']
             and states('sensor.p1reader2_p1_reader_2_current_l3') not in ['unavailable', 'unknown'] }}
    action:
      - variables:
          l1: "{{ states('sensor.p1reader2_p1_reader_2_current_l1') | float(0) }}"
          l2: "{{ states('sensor.p1reader2_p1_reader_2_current_l2') | float(0) }}"
          l3: "{{ states('sensor.p1reader2_p1_reader_2_current_l3') | float(0) }}"
          max_phase: "{{ [l1, l2, l3] | max }}"
          fuse_limit: 25
          current_dch: "{{ states('number.inverter_battery_max_discharging_current') | float(0) }}"
          hold_until: "{{ states('input_datetime.ems_soft_fuse_hold_until') }}"
          hold_active: "{{ as_timestamp(hold_until) > as_timestamp(now()) if hold_until not in ['unavailable', 'unknown'] else false }}"
          ems_state: "{{ states('input_select.ems_state') }}"
          dch_floor: "{{ 0 if ems_state in ['GRID_USE', 'DUMP'] else 240 }}"
          safe_since: "{{ states('input_datetime.ems_soft_fuse_safe_since') }}"
      - choose:
          # --- OVERLOAD (>= 26A) — step up, 30s cooldown between steps ---
          - conditions: "{{ max_phase >= 26 }}"
            sequence:
              # Only act if cooldown expired (battery needs ramp time between steps)
              - condition: template
                value_template: "{{ not hold_active }}"
              - variables:
                  overshoot: "{{ (max_phase - fuse_limit) | int }}"
                  dch_increase_a: "{{ (overshoot * 5) | int }}"
                  new_dch: "{{ [current_dch + dch_increase_a, 240] | min | int }}"
              - choose:
                  # Meaningful lift available
                  - conditions: "{{ (new_dch - current_dch) >= 2 and new_dch <= 240 }}"
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.inverter_battery_max_discharging_current
                        data:
                          value: "{{ new_dch }}"
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.ems_soft_fuse_hold_until
                        data:
                          datetime: "{{ (now() + timedelta(seconds=30)).strftime('%Y-%m-%d %H:%M:%S') }}"
                      - action: system_log.write
                        data:
                          message: "Soft Fuse OVERLOAD: {{ max_phase }}A (+{{ overshoot }}A over fuse), Batt Dch {{ current_dch }}→{{ new_dch }}A"
                          level: warning
                          logger: homeassistant.energy.soft_fuse
                # Battery at ceiling — kill dumpload (DUMP only)
                default:
                  - condition: template
                    value_template: "{{ ems_state == 'DUMP' }}"
                  - action: select.select_option
                    target:
                      entity_id: select.inverter_io_mode
                    data:
                      option: "Generator"
                  - action: system_log.write
                    data:
                      message: "Soft Fuse OVERLOAD: {{ max_phase }}A, battery dch at ceiling ({{ current_dch }}A) — killed dumpload"
                      level: error
                      logger: homeassistant.energy.soft_fuse

          # --- SAFE (< 23A) — ladder down battery dch after 60s sustained ---
          - conditions: "{{ max_phase < 23 }}"
            sequence:
              # Track when SAFE zone started
              - choose:
                  - conditions: >
                      {{ safe_since in ['unavailable', 'unknown']
                         or as_timestamp(safe_since) < as_timestamp(now()) - 120 }}
                    sequence:
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.ems_soft_fuse_safe_since
                        data:
                          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Only reduce if no cooldown active and 60s sustained
              - condition: template
                value_template: "{{ not hold_active }}"
              - condition: template
                value_template: >
                  {{ safe_since not in ['unavailable', 'unknown']
                     and (as_timestamp(now()) - as_timestamp(safe_since)) >= 60 }}
              - variables:
                  undershoot: "{{ (24 - max_phase) | int }}"
                  dch_decrease_a: "{{ (undershoot * 5) | int }}"
                  new_dch: "{{ [current_dch - dch_decrease_a, dch_floor] | max | int }}"
              - condition: template
                value_template: "{{ (current_dch - new_dch) >= 2 }}"
              - action: number.set_value
                target:
                  entity_id: number.inverter_battery_max_discharging_current
                data:
                  value: "{{ new_dch }}"
              - action: system_log.write
                data:
                  message: "Soft Fuse SAFE: {{ max_phase }}A, Batt Dch {{ current_dch }}→{{ new_dch }}A (floor={{ dch_floor }}A)"
                  level: info
                  logger: homeassistant.energy.soft_fuse

        # --- NOMINAL (23-25A) — dead zone, reset SAFE tracker ---
        default:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ems_soft_fuse_safe_since
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
